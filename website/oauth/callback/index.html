<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Signed in · HttpDash</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --ink: #1d1d1f; --ink-2: #5f6368; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121317; --ink: #f2f2f3; --ink-2: #a2a5ad; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif; padding: 0 16px; }
    main { text-align: center; max-width: 420px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--ink-2); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>You can close this window</h1>
    <p>HttpDash uses this address as an OAuth 2.0 callback. The app reads the sign-in result before this page loads, so there is nothing to do here.</p>
  </main>
</body>
</html>
